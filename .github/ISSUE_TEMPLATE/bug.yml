name: Bug
description: Something does not work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Leave out holdings, amounts, account names, record contents, tokens and keys. Security problems go through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: ganjine version
      description: Output of ./ganjine version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: reporter
    attributes:
      label: Written by an agent?
      description: If so, which one. A person must have read this report.
